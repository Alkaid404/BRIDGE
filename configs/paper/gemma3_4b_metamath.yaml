extends: llama3b_metamath.yaml
output_dir: runs/gemma3_4b_paper
model_name_or_path: ${BRIDGE_MODEL_PATH}

scoring_attention_layer_strategy: last_global
scoring_attention_layer_index: null
num_gpus: 4
fsdp: true
batch_size: 2
gradient_accumulation_steps: 8
warmup_batch_size: 2
warmup_gradient_accumulation_steps: 8
fsdp_config:
  version: 2
  reshard_after_forward: true
  cpu_offload: false
  activation_checkpointing: true
  state_dict_type: FULL_STATE_DICT
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: [Gemma3DecoderLayer]
